default_stages: [pre-commit]

repos:
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.36
    hooks:
      - id: pymarkdown
        args:
        - --config=.pymarkdown.json
        - scan
  - repo: local
    hooks:
      - id: python-reveiw-check
        name: Python Review Check
        entry: python tools/review_check.py
        language: python
        additional_dependencies: [] # Add any package dependencies here if needed later
        pass_filenames: false
